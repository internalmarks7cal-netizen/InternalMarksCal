<script>
/* Show calculator after splash screen */
window.addEventListener("load", function () {
    setTimeout(function () {
        document.getElementById("main").style.display = "block";
    }, 1000);
});

/* Attendance marks */
function getAttendanceMarks(att) {
    if (att >= 90) return 5;
    else if (att >= 85) return 4;
    else if (att >= 80) return 3;
    else if (att >= 75) return 2;
    else return 0;
}

/* Validate numeric inputs */
function readNumber(id, label, min, max) {
    const input = document.getElementById(id);
    const rawValue = input.value.trim();

    if (rawValue === "") {
        return {
            value: null,
            error: "Please enter " + label + "."
        };
    }

    const value = Number(rawValue);

    if (!Number.isFinite(value)) {
        return {
            value: null,
            error: "Please enter a valid number for " + label + "."
        };
    }

    if (value < min || (max !== null && value > max)) {
        return {
            value: null,
            error: label + " must be between " + min +
                (max !== null ? " and " + max : "") + "."
        };
    }

    return { value: value, error: null };
}

/* Calculate internal marks */
function calculateMarks() {
    const fields = [
        { id: "a1", label: "A1 marks", min: 0, max: 20 },
        { id: "a2", label: "A2 marks", min: 0, max: 20 },
        { id: "m1", label: "M1 marks", min: 0, max: null },
        { id: "m2", label: "M2 marks", min: 0, max: null },
        { id: "att", label: "attendance percentage", min: 0, max: 100 }
    ];

    const values = {};

    for (const field of fields) {
        const result = readNumber(
            field.id,
            field.label,
            field.min,
            field.max
        );

        if (result.error) {
            document.getElementById("output").textContent = result.error;
            document.getElementById(field.id).focus();
            return;
        }

        values[field.id] = result.value;
    }

    const a1 = values.a1;
    const a2 = values.a2;
    const m1 = values.m1;
    const m2 = values.m2;
    const att = values.att;

    const avg = (a1 + a2) / 2;
    const assignment = avg * (15 / 20);

    const highMid = Math.max(m1, m2);
    const lowMid = Math.min(m1, m2);

    const high = highMid * 0.75;
    const low = lowMid * 0.24;

    const attendance = getAttendanceMarks(att);
    const total = assignment + high + low + attendance;

    const output = document.getElementById("output");

    output.innerHTML =
        "<b>Total Internal Marks = " + total.toFixed(2) + "</b><br><br>" +

        "<b>Detailed Calculations:</b><br><br>" +

        "A1 = " + a1 + "<br>" +
        "A2 = " + a2 + "<br>" +

        "Average = (" + a1 + " + " + a2 + ") ÷ 2 = " +
        avg.toFixed(2) + "<br>" +

        "Assignment = " + avg.toFixed(2) +
        " × (15/20) = " + assignment.toFixed(2) + "<br><br>" +

        "Higher Mid = " + highMid +
        " × 0.75 = " + high.toFixed(2) + "<br>" +

        "Lower Mid = " + lowMid +
        " × 0.24 = " + low.toFixed(2) + "<br><br>" +

        "Attendance % = " + att + "<br>" +

        "Attendance Bonus = " + attendance + "<br><br>" +

        "<b>Final Total = " +
        assignment.toFixed(2) + " + " +
        high.toFixed(2) + " + " +
        low.toFixed(2) + " + " +
        attendance + " = " + total.toFixed(2) +
        "</b>";
}
</script>
